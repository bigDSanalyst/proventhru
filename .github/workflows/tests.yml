name: tests
on: [push, pull_request]
jobs:
  coqtop:
    # Coq 8.18 from Ubuntu; the Petanque tests skip themselves here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y coq
      - run: python -m unittest discover -s tests -v

  petanque:
    # Rocq 9.1 + coq-lsp (pet) from opam, and Pytanque; runs both backends.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - run: opam install -y rocq-core.9.1.1 rocq-stdlib coq-lsp.0.2.5+9.1
      - run: sudo apt-get update && sudo apt-get install -y coq
      - run: pip install -e '.[petanque]'
      - run: |
          eval $(opam env)
          # apt's coqtop/coqc stay first on PATH for the coqtop backend; pet
          # and rocq come from opam for the Petanque backend.
          export PATH="/usr/bin:$PATH"
          python -c "from proventhru.session import petanque_available as p; assert p()"
          python -m unittest discover -s tests -v
          python tools/compare_backends.py examples/conjectures.txt --budget 60
